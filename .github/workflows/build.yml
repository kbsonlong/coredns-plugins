name: Build CoreDNS with azroute/splitnet/georoute

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-coredns-with-plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Clone CoreDNS source
        run: |
          git clone --depth 1 https://github.com/coredns/coredns.git coredns-src

      - name: Build CoreDNS with plugins (multi-arch)
        shell: bash
        env:
          CI: true
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          chmod +x build-test.sh
          ./build-test.sh "$(pwd)/coredns-src"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coredns-with-plugins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build-output/coredns-with-plugins